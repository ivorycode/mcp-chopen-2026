<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="780" viewBox="0 0 2080 780" role="img" aria-labelledby="title desc">
  <title id="title">MCP verpackt denselben Tool-Aufruf für externe Assistenten</title>
  <desc id="desc">Links: Ohne MCP ruft die Anwendung im selben Prozess direkt die Tool-Definition und den Handler auf und erhält das Resultat als Rückgabewert zurück. Rechts: Mit MCP steckt das Sprachmodell im Host eines externen Assistenten, der MCP-Client sendet denselben Aufruf als standardisierte tools/call-Nachricht über eine Prozess- oder Netzwerkgrenze an unseren MCP-Server, welcher den gleichen Handler wie links aufruft und das Resultat als MCP-Nachricht zurückschickt. MCP ändert nicht, was aufgerufen wird, sondern verpackt Aufruf und Resultat für die Übertragung.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 26px; font-weight: 700; }
      .body { font-size: 22px; }
      .label { font-size: 20px; fill: #475569; }
      .note { font-size: 19px; fill: #0f766e; }
      .tag { font-size: 19px; font-weight: 700; fill: #c2410c; }
      .code { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 19px; }
      .line { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#loop-arrow); }
      .app { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .model { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .server { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; }
      .boundary { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10 8; }
      .wrap { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; stroke-dasharray: 8 6; }
      .legend { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="2080" height="780" fill="#fff"/>
  <text x="1040" y="44" text-anchor="middle" class="title">MCP: derselbe Tool-Aufruf, jetzt verpackt für externe Assistenten</text>
  <text x="1040" y="74" text-anchor="middle" class="label">Modell → Aufruf → Ausführung → Resultat bleibt gleich, MCP kapselt nur Übergabe und Rückgabe</text>

  <path d="M 830 100 V 590" class="boundary"/>

  <text x="500" y="118" text-anchor="middle" class="heading">Ohne MCP · Aufruf im selben Prozess</text>
  <text x="1445" y="118" text-anchor="middle" class="heading">Mit MCP · Aufruf über Host, Client und Server</text>

  <!-- Linkes Panel: direkter In-Process-Aufruf -->
  <rect x="220" y="150" width="560" height="110" rx="16" class="model"/>
  <text x="500" y="192" text-anchor="middle" class="heading">Sprachmodell (beim Anbieter)</text>
  <text x="500" y="226" text-anchor="middle" class="body">liefert toolName + input</text>
  <text x="500" y="250" text-anchor="middle" class="code">z. B. addToCart({ articleId, qty })</text>

  <path d="M 500 260 V 320" class="line"/>

  <rect x="220" y="320" width="560" height="170" rx="16" class="app"/>
  <text x="500" y="362" text-anchor="middle" class="heading">Anwendung (App-Server)</text>
  <text x="500" y="396" text-anchor="middle" class="body">Tool-Definition + Handler · execute()</text>
  <text x="500" y="424" text-anchor="middle" class="label">Direkter Funktionsaufruf im selben Prozess</text>
  <text x="500" y="452" text-anchor="middle" class="code">core/handlers.ts</text>

  <path d="M 220 405 H 140 V 205 H 220" class="loop"/>
  <text x="124" y="292" text-anchor="end" class="note">Resultat</text>
  <text x="124" y="318" text-anchor="end" class="note">zurück</text>

  <text x="500" y="560" text-anchor="middle" class="label">Kein Protokoll nötig — nur ein Funktionsaufruf</text>

  <!-- Rechtes Panel: MCP-Host, Client, Server -->
  <rect x="880" y="150" width="330" height="320" rx="20" class="boundary"/>
  <text x="900" y="176" class="label">Host (externer Assistent)</text>

  <rect x="910" y="196" width="270" height="100" rx="14" class="model"/>
  <text x="1045" y="232" text-anchor="middle" class="heading">Sprachmodell</text>
  <text x="1045" y="264" text-anchor="middle" class="body">liefert toolName + input</text>

  <path d="M 1045 296 V 336" class="line"/>

  <rect x="910" y="336" width="270" height="110" rx="14" class="app"/>
  <text x="1045" y="374" text-anchor="middle" class="heading">MCP-Client</text>
  <text x="1045" y="404" text-anchor="middle" class="body">im Host integriert</text>
  <text x="1045" y="430" text-anchor="middle" class="label">kennt tools/list</text>

  <!-- Wrapper: MCP-Nachricht über die Prozess-/Netzwerkgrenze -->
  <rect x="1230" y="330" width="340" height="150" rx="14" class="wrap"/>
  <text x="1400" y="316" text-anchor="middle" class="tag">MCP-Nachricht (JSON-RPC)</text>

  <path d="M 1180 372 H 1590" class="line"/>
  <text x="1400" y="360" text-anchor="middle" class="label">tools/call</text>
  <text x="1400" y="398" text-anchor="middle" class="code">{ name, arguments }</text>

  <path d="M 1590 434 H 1180" class="loop"/>
  <text x="1400" y="460" text-anchor="middle" class="note">result: { content }</text>

  <rect x="1590" y="170" width="420" height="340" rx="16" class="server"/>
  <text x="1800" y="216" text-anchor="middle" class="heading">MCP-Server (unsere App)</text>
  <text x="1800" y="252" text-anchor="middle" class="body">Empfängt tools/call,</text>
  <text x="1800" y="280" text-anchor="middle" class="body">ruft denselben Handler auf</text>
  <text x="1800" y="308" text-anchor="middle" class="label">wie im Prozess links</text>
  <text x="1800" y="336" text-anchor="middle" class="code">core/handlers.ts</text>
  <text x="1800" y="478" text-anchor="middle" class="label">eigener Prozess,</text>
  <text x="1800" y="502" text-anchor="middle" class="label">evtl. eigener Rechner</text>

  <text x="1445" y="560" text-anchor="middle" class="label">Gleiche Shop-Logik, jetzt hinter einer Protokollgrenze</text>

  <!-- Merksatz -->
  <rect x="60" y="600" width="1960" height="110" rx="14" class="legend"/>
  <text x="90" y="642" class="label"><tspan style="font-weight:700;fill:#172033">Merke:</tspan> MCP ändert nicht, welcher Handler läuft, sondern nur, wie der Aufruf dorthin kommt.</text>
  <text x="90" y="676" class="label">Client und Server tauschen denselben Aufruf und dasselbe Resultat als standardisierte MCP-Nachricht aus — ein Wrapper um den vertrauten Tool-Call.</text>
</svg>
