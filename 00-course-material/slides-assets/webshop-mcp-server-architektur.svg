<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="820" viewBox="0 0 1760 820" role="img" aria-labelledby="title desc">
  <title id="title">Der Webshop als MCP-Server: das Sprachmodell steckt im Host, nicht in unserem Server</title>
  <desc id="desc">Links steht der Host eines externen Assistenten, zum Beispiel Claude Desktop: dort laufen das Sprachmodell und der MCP-Client. Rechts läuft unser App-Server als ein Node-Prozess ohne eigenes Sprachmodell. Der MCP-Client sendet tools/call über Streamable HTTP an POST /mcp, unser MCP-Server registriert sechs Tools (searchProducts, getCart, addToCart, removeFromCart, checkout, getOrders) und delegiert an bestehende Shop-Handler. Diese Handler und ihr In-Memory-Zustand für Warenkorb und Bestellungen werden im selben Prozess sowohl vom MCP-Server als auch von der Web-UI der Browser-Route genutzt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 21px; }
      .label { font-size: 19px; fill: #475569; }
      .note { font-size: 18px; fill: #0f766e; }
      .code { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 18px; fill: #475569; }
      .badge-text { font-size: 17px; font-weight: 700; fill: #fff; }
      .line { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#loop-arrow); }
      .app { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .model { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .server { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; }
      .store { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .boundary { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10 8; }
      .badge { fill: #ea580c; }
      .legend { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1760" height="820" fill="#fff"/>
  <text x="880" y="42" text-anchor="middle" class="title">Der Webshop als MCP-Server</text>
  <text x="880" y="72" text-anchor="middle" class="label">Der externe Assistent bringt Modell und MCP-Client mit — unser Server führt nur die Tools aus</text>

  <!-- Host: externer Assistent -->
  <rect x="60" y="110" width="560" height="340" rx="20" class="boundary"/>
  <text x="80" y="138" class="label">Host — externer Assistent (z. B. Claude Desktop)</text>

  <rect x="90" y="160" width="500" height="120" rx="16" class="model"/>
  <text x="340" y="200" text-anchor="middle" class="heading">Sprachmodell (LLM)</text>
  <text x="340" y="234" text-anchor="middle" class="body">z. B. Claude, GPT, Gemini</text>
  <text x="340" y="260" text-anchor="middle" class="label">läuft beim Anbieter, nicht bei uns</text>

  <path d="M 340 280 V 330" class="line"/>

  <rect x="90" y="330" width="500" height="100" rx="16" class="app"/>
  <text x="340" y="366" text-anchor="middle" class="heading">MCP-Client</text>
  <text x="340" y="398" text-anchor="middle" class="body">sendet tools/call, empfängt Resultate</text>

  <!-- Verbindung über Streamable HTTP -->
  <path d="M 590 360 L 820 240" class="line"/>
  <text x="705" y="250" text-anchor="middle" class="label">tools/call</text>

  <path d="M 820 320 L 590 420" class="loop"/>
  <text x="705" y="400" text-anchor="middle" class="note">result</text>

  <!-- Unser App-Server -->
  <rect x="780" y="110" width="880" height="580" rx="20" class="boundary"/>
  <text x="800" y="138" class="label">Unser App-Server — ein Node-Prozess, kein LLM</text>

  <rect x="820" y="170" width="800" height="200" rx="16" class="server"/>
  <text x="1220" y="208" text-anchor="middle" class="heading">MCP-Server · POST /mcp</text>
  <text x="1220" y="240" text-anchor="middle" class="body">Streamable-HTTP-Adapter</text>
  <text x="1220" y="266" text-anchor="middle" class="label">6 Tools → delegiert an bestehende Shop-Handler</text>
  <text x="1220" y="296" text-anchor="middle" class="code">searchProducts · getCart · addToCart</text>
  <text x="1220" y="322" text-anchor="middle" class="code">removeFromCart · checkout · getOrders</text>

  <rect x="1480" y="182" width="170" height="36" rx="18" class="badge"/>
  <text x="1565" y="206" text-anchor="middle" class="badge-text">kein LLM hier</text>

  <path d="M 1220 370 V 420" class="line"/>

  <rect x="820" y="420" width="800" height="100" rx="16" class="app"/>
  <text x="1220" y="456" text-anchor="middle" class="heading">Web-UI · Browser-Route</text>
  <text x="1220" y="488" text-anchor="middle" class="body">Normale Shop-Seiten, gleiche Browser-Session</text>

  <path d="M 1220 520 V 560" class="line"/>

  <rect x="820" y="560" width="800" height="110" rx="16" class="store"/>
  <text x="1220" y="596" text-anchor="middle" class="heading">Shop-Handler + Zustand</text>
  <text x="1220" y="628" text-anchor="middle" class="body">In-Memory Warenkorb und Bestellungen</text>
  <text x="1220" y="654" text-anchor="middle" class="label">gemeinsam für MCP-Server und Web-UI im selben Prozess</text>

  <!-- Merksatz -->
  <rect x="60" y="710" width="1640" height="90" rx="14" class="legend"/>
  <text x="90" y="748" class="label"><tspan style="font-weight:700;fill:#172033">Merke:</tspan> Das Sprachmodell steckt im Host des externen Assistenten, nie in unserem MCP-Server.</text>
  <text x="90" y="778" class="label">Unser Server bleibt reine Tool-Ausführung — Web-UI und MCP-Server teilen sich im selben Prozess denselben Warenkorb.</text>
</svg>
